plugins { id 'com.android.application' }
android {
    namespace 'com.photopick.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.photopick.pp1'
        testInstrumentationRunner 'com.photopick.app.UpdaterChecks'
        minSdk 29
        targetSdk 35
        versionCode 17
        versionName '0.5.4'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
